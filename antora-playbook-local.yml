site:
  url: http://localhost:8000
  start_page: ROOT::index.adoc
content:
  sources:
    - url: ''
      start_path: src
asciidoc:
  attributes:
    kroki-fetch-diagram: false
    kroki-default-format: svg@
    kroki-server-url: http://fruit.ritger.nl:9000
  extensions:
    - asciidoctor-kroki
output:
  clean: true
  dir: docs
urls:
  latest_version_segment: ''
ui:
  bundle:
    url: https://github.com/netbeheernederland/antora-ui-nbnl/releases/download/1.2/ui-bundle.zip
  default_layout: single-page  # TODO: `standard`
antora:
  extensions:
    - require: 'scripts/configure-collector.js'
    - require: '@antora/collector-extension'
    - require: 'scripts/post-process-versions.js'
    - require: 'scripts/post-process-site.js'
      artifacts_dir: artifacts
    - require: '@antora/lunr-extension'
